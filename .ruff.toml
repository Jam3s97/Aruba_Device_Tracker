# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "CPY001", # no per-file copyright headers; LICENSE file covers the repo
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is how pytest works
    "SLF001",  # tests intentionally inspect private state
    "ANN001",  # fixture args (requests_mock, caplog, etc.) don't need annotations
    "ANN002",  # *args on fake/stub signatures don't need annotations
    "ANN003",  # **kwargs on fake/stub signatures don't need annotations
    "ANN201",  # test functions don't need return type annotations
    "ANN202",  # nested helpers/stubs don't need return type annotations
    "D101",    # test classes don't need docstrings
    "D102",    # test methods don't need docstrings
    "D107",    # fake __init__ methods don't need docstrings
    "EM101",   # raising a literal is fine when provoking an error path
    "TRY003",  # ditto: test doubles don't need exception message classes
    "PLR2004", # magic values are fine in test assertions
]
